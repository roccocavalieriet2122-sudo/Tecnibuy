<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TecniBuy - Marketplace Fragatero</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
</head>
<body>
  <header class="header" role="banner">
    <div class="container header-inner">
      <a href="#/" class="logo" aria-label="TecniBuy - Inicio">
        <span class="logo-icon" aria-hidden="true">🛒</span>
        <span class="logo-text">TecniBuy</span>
      </a>

      <nav class="nav-main" role="navigation" aria-label="Navegación principal">
        <ul class="nav-list">
          <li><a href="#/" class="nav-link" data-page="home">Inicio</a></li>
          <li><a href="#/productos" class="nav-link" data-page="products">Productos</a></li>
          <li><a href="#/categorias" class="nav-link" data-page="categories">Categorías</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <div class="search-box" role="search">
          <label for="search-input" class="visually-hidden">Buscar productos</label>
          <input type="search" id="search-input" placeholder="Buscar productos..." class="search-input" aria-label="Buscar productos">
          <button type="submit" class="search-btn" aria-label="Buscar">🔍</button>
        </div>

        <div class="user-menu" id="user-menu">
          <!-- Populated by JS -->
        </div>

        <button class="menu-toggle" id="menu-toggle" aria-label="Menú" aria-expanded="false" aria-controls="nav-main">
          <span aria-hidden="true">☰</span>
        </button>
      </div>
    </div>
  </header>

  <main id="app" role="main" class="container">
    <!-- Page content rendered here -->
  </main>

  <footer class="footer" role="contentinfo">
    <div class="container">
      <p>TecniBuy - Tu marketplace de confianza 🇦🇷</p>
      <p class="footer-links">
        <a href="#/terminos">Términos</a> · <a href="#/privacidad">Privacidad</a> · <a href="#/contacto">Contacto</a>
      </p>
    </div>
  </footer>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container" role="region" aria-live="polite" aria-label="Notificaciones"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
